# SITECALI-Res · Microproyecto 1 · balanceador del clúster LXD
# Contenedor haproxy en nodo1 (240.21.0.10). Parte C: reparto por turnos entre web1 y web2.
# La Parte D agrega los dos respaldos y la página 503.
# Las credenciales de estadísticas son solo de laboratorio: la red 192.168.56.0/24 es interna del portátil.

global
    log /dev/log local0
    maxconn 4096
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    default-server inter 2s fall 3 rise 2

frontend http
    bind *:80
    default_backend web-backend

backend web-backend
    balance roundrobin
    stats enable
    stats auth sitecali:nube2026
    stats uri /haproxy?stats
    stats refresh 5s
    server web1 240.22.0.11:80 check
    server web2 240.23.0.11:80 check
