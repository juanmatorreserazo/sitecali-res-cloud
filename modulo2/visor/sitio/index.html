<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SITECALI-Res · Cali, barrio por barrio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
/* Marca 1.0 de SITECALI-Res: cal, tinta y un solo encendido (el barrio que se mira). Datos en petróleo y ocre. */
:root{
  --cal:#F4F1EA; --panel:#EBE7DD; --tinta:#15161A; --sec:#4A4C52; --filete:#D8D2C5; --encendido:#F0442E;
  --s1:#DCE9EC; --s2:#A9CBD4; --s3:#6FA9B8; --s4:#3A889F; --s5:#0F6E8C;
  --d1:#C98A1B; --d2:#E6CD9C; --d3:#EBE7DD; --d4:#A9CBD4; --d5:#0F6E8C;
  --vacio:#E4DFD3; --trama:#B9B2A2; --borde:rgba(21,22,26,.28);
  --f:'Instrument Sans',Arial,sans-serif; --fs:'Instrument Serif',Georgia,serif; --fm:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --cal:#15161A; --panel:#1E2025; --tinta:#F4F1EA; --sec:#B9B5AC; --filete:#34363C;
  --s1:#173A46; --s2:#1E5568; --s3:#2B7A93; --s4:#58A6BD; --s5:#A3D6E4;
  --d1:#E0A53A; --d2:#8A6A2C; --d3:#2A2C31; --d4:#1E5568; --d5:#A3D6E4;
  --vacio:#24262B; --trama:#5A5C62; --borde:rgba(244,241,234,.30);
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cal);color:var(--tinta);font:16px/1.5 var(--f);min-height:100vh;display:flex;flex-direction:column}
header,main,footer{width:100%;max-width:1240px;margin:0 auto;padding:0 20px}
header{padding-top:20px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{display:block;width:300px;max-width:70vw;height:auto;color:var(--tinta);margin-left:-15px}
.rotulo{font:500 12px/1.4 var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--sec);margin:0}
h1{font-weight:600;font-size:clamp(28px,4vw,40px);line-height:1.15;margin:18px 0 6px}
h1 em,.lema{font-family:var(--fs);font-style:italic;font-weight:400}
.entrada{color:var(--sec);margin:0 0 16px;max-width:72ch}
.lentes{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.lentes button,.ctl button{font:500 14px/1 var(--f);color:var(--tinta);background:transparent;border:1px solid var(--filete);border-radius:999px;padding:9px 14px;cursor:pointer}
.lentes button[aria-pressed="true"]{background:var(--tinta);color:var(--cal);border-color:var(--tinta)}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--s5);outline-offset:2px}
.mesa{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.plano{border:1px solid var(--filete);border-radius:10px;overflow:hidden;background:var(--cal)}
canvas{display:block;width:100%;height:min(60vh,600px);touch-action:none;cursor:grab}
canvas.arrastre{cursor:grabbing}
.barra{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--filete);min-height:56px}
.ctl{display:flex;gap:6px;margin-left:auto;flex:none}
.ctl button{background:var(--cal);width:40px;height:40px;padding:0;border-radius:8px;font-size:18px}
.ctl button.todo{width:auto;padding:0 12px;font-size:13px}
.pista{font:12.5px/1.35 var(--fm);color:var(--sec);margin:0;min-width:0}
aside{background:var(--panel);border-radius:10px;padding:18px}
aside h2{font-size:21px;line-height:1.2;margin:0 0 2px;font-weight:600}
aside .sub{color:var(--sec);margin:0 0 12px;font-size:14px}
.buscar{width:100%;font:15px var(--f);padding:9px 10px;border:1px solid var(--filete);border-radius:8px;background:var(--cal);color:var(--tinta);margin-bottom:14px}
.leyenda{list-style:none;margin:10px 0 0;padding:0;font:13px/1.3 var(--fm)}
.leyenda li{display:flex;align-items:center;gap:8px;margin:4px 0}
.leyenda i{width:22px;height:14px;border-radius:3px;border:1px solid var(--borde);flex:none}
.nota{font-size:13.5px;color:var(--sec);margin:12px 0 0}
dl{margin:0}
dl div{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 12px;padding:8px 0;border-top:1px solid var(--filete)}
dt{font-size:14px;color:var(--sec);flex:1 1 0;min-width:0}
dt small{display:block;font-size:12px}
dd{margin:0;font:500 16px/1.3 var(--fm);text-align:right;white-space:nowrap;flex:none}
dd.mas{flex-basis:100%;text-align:left;font:12px/1.45 var(--fm);color:var(--sec);white-space:normal;margin-top:4px}
.aviso{font-size:13.5px;margin:10px 0 0;padding:8px 10px;border-left:3px solid var(--d1);background:var(--cal)}
.volver{margin-top:14px;font:500 13px var(--f);background:transparent;color:var(--tinta);border:1px solid var(--filete);border-radius:999px;padding:8px 12px;cursor:pointer}
footer{margin-top:28px;padding-top:16px;padding-bottom:24px;border-top:1px solid var(--filete);display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;color:var(--sec);font-size:13px}
.firma .logo{width:190px;margin-left:-9px}
.firma .lema{margin:2px 0 0;font-size:16px;color:var(--tinta)}
.fuente{max-width:62ch;margin:0}
.servidor{font:12px/1.4 var(--fm);letter-spacing:.06em;margin:0}
.falta{padding:40px 0;max-width:60ch}
@media (max-width:860px){.mesa{grid-template-columns:1fr}canvas{height:52vh}}
</style>
</head>

  cv.addEventListener('pointermove', function (e) {

    if (arr) {
      var dx = e.clientX - arr.x, dy = e.clientY - arr.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) { movido = true; cv.classList.add('arrastre'); }
      if (movido) { tx = arr.tx + dx; ty = arr.ty + dy; pintar(); }
      return;
    }
    var b = barrioEn(px, py);
    if (b !== sobre) {
      sobre = b; pintar();
      var p = $('pista');
      if (b) { var v = b.v[lente.id]; p.textContent = (b.nombre || 'Barrio') + ' · ' + (v == null ? (lente.id === 'tasa' && b.estado !== 'publicado' ? 'suprimido' : 'sin dato') : nf(v, lente.decimales)); }

    }
  });

  cv.addEventListener('keydown', function (e) {
    var k = e.key, p = 40;
    if (k === '+' || k === '=') zoom(1.25, vw / 2, vh / 2); else if (k === '-') zoom(0.8, vw / 2, vh / 2);
    else if (k === 'ArrowLeft') { tx += p; pintar(); } else if (k === 'ArrowRight') { tx -= p; pintar(); }
    else if (k === 'ArrowUp') { ty += p; pintar(); } else if (k === 'ArrowDown') { ty -= p; pintar(); }
    else if (k === 'Escape') elegir(null); else return;
    e.preventDefault();
  });
  $('acercar').addEventListener('click', function () { zoom(1.4, vw / 2, vh / 2); });
  $('alejar').addEventListener('click', function () { zoom(1 / 1.4, vw / 2, vh / 2); });
  $('todo').addEventListener('click', function () { encuadrar([0, 0, W, H]); pintar(); });

  var c = D.corte && D.corte[0];
  $('fuente').textContent = 'Datos del corte público de SITECALI-Res' + (c ? ', base ' + c.version + ', huella ' + c.huella : '') +
    ', generados el ' + fecha(D.generado) + '. Los conteos publicados son cero o de ' + D.k + ' en adelante; las tasas usan la población de referencia corregida por omisión.';
  function todo() { medir(); hacerTrama(); encuadrar([0, 0, W, H]); pintar(); }
  botones(); ficha(); todo();
  var espera; window.addEventListener('resize', function () { clearTimeout(espera); espera = setTimeout(todo, 120); });
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { css = getComputedStyle(document.documentElement); todo(); ficha(); });
