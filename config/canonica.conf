# Ingesta de la base canónica de SITECALI-Res (carpeta 02_canonica, GeoParquet y GeoTIFF por tema).
# La lee modulo1/scripts/25_canonica.py y, de forma independiente, 60_auditar_divulgacion.py.
#
# El paquete lo arma herramientas/armar_paquete_curso.ps1 en el equipo anfitrión y queda en datos/ como
# canonica_publica_AAAAMMDD.zip. Su huella cambia con la fecha y con cada versión de la canónica, así que no se fija
# aquí: lo que se verifica es cada archivo contra la huella SHA-256 de los manifiestos de la propia canónica
# (manifiesto_*.csv y ciudad/ob_20m/manifiesto_ob_20m.json). Un archivo sin manifiesto o con huella distinta no se
# publica y queda en el reporte.

[paquete]
patron = canonica_publica_*.zip

# Si el paquete trae cualquier ruta que coincida con estos patrones, la etapa se detiene sin descomprimir nada:
# son las bóvedas reservadas, los registros por persona y los archivos internos de la canónica.
prohibidos = eventos_reservado/*, educacion_reservado/*, *_registros_*, *replicas*, *mayores_arreglos*, *conteos_eventos*, *simat_2025_*

[compuerta]
# Doble regla. Por archivo: la condición del inventario tiene que ser una de estas.
condiciones_publicas = abierta/pública
# Por columna: la sensibilidad del catálogo tiene que ser una de estas. Lo que no está en el catálogo no sale.
# La geometría no figura en los catálogos; sale cuando el archivo es público por inventario.
sensibilidades_publicas = publico, abierto

[postgis]
# Tablas de la canónica que se cargan a PostGIS, en el esquema «publico» con el prefijo can_.
# Las demás quedan en la zona pública como Parquet filtrado (publico/canonica/parquet), listas para un
# almacenamiento de objetos en la nube.
tablas = unidades/manzana.parquet, unidades/seccion.parquet, unidades/barrio.parquet,
         unidades/comuna_corregimiento.parquet, territorio/territorio_manzana.parquet,
         poblacion/poblacion_referencia.parquet, poblacion/afro_corregida_2018.parquet,
         ciudad/medidas_manzana_2025.parquet, ciudad/suelo_norma_manzana.parquet,
         ciudad/edificacion_open_buildings_manzana_anio.parquet, censo/censo2005_manzana.parquet,
         censo/censo2018_manzana.parquet, catastro/registro_r1_2023_manzana.parquet,
         catastro/cartografia_2024_manzana.parquet, capas/servicios/sedes_educativas.parquet,
         capas/servicios/salud_equipamientos.parquet, capas/servicios/idesc_espacio_publico_efectivo.parquet,
         capas/red_vial/pot_jerarquia_vial.parquet, capas/pot/pot_clasificacion_suelo.parquet

[raster]
# Todo ráster verificado se convierte a GeoTIFF optimizado para la nube (COG). El año indicado se recorta además
# por comuna (segmentación) con la geometría de unidades/comuna_corregimiento.parquet.
compresion = DEFLATE
segmentar = ciudad/ob_20m/ob_20m_2023.tif
unidades = unidades/comuna_corregimiento.parquet
campo_unidad = unidad_admin
solo_comunas = si

[huellas_fijadas]
# Huellas aceptadas por decisión mientras la canónica no actualice su manifiesto. El manifiesto
# ciudad/ob_20m/manifiesto_ob_20m.json dice versión c6.5, pero su extensión y sus huellas son de una malla anterior
# (1.965 × 2.192 píxeles frente a los 2.898 × 3.125 de los archivos), así que no sirve para verificarlos. Estas son las
# huellas de los archivos que recibió el curso el 5 de noviembre de 2026. Cuando la canónica regenere su manifiesto,
# esta sección se vacía y la verificación vuelve a depender solo de los manifiestos.
ciudad/ob_20m/ob_20m_2016.tif = d0e7397e36538bfc779e2fcd83f6e4e9b71d3fbe8f8d86350f52600809850230
ciudad/ob_20m/ob_20m_2017.tif = 22c0b3884aa1a7505485b0acdc8eac7348680bfe0bf07c31c966eeafda64b2d7
