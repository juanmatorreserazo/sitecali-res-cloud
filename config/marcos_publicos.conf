# Marcos públicos por manzana que salen de la zona interna, tomados de la base de referencia 2.4.113.
# Cada línea se ejecuta como: sitecali.py marco BASE --campos CAMPOS --nivel manzana [--vigencia V] --publico
# Formato: nombre | campos (sintaxis de sitecali.py) | vigencia (año, «todas» o «-» si ninguna tabla es temporal)
# Añadir un marco aquí no basta para publicarlo: la auditoría de divulgación corre después y detiene la carga
# si encuentra algo interno.
# Desde la 2.4.113 se usan los módulos recalculados en la línea v2.5 (esp5_, bar5_, fys5_, acc5_, acf5_, ofe5_);
# los de la v2.4 (esp_, bar_, fys_, acc_, acf_, ofe_) figuran como reemplazados. Ningún módulo interno entra aquí
# (cyc5_, may_, vme_, drv2_, hmz_, lpm_, cmpa_, cco_, vgd_, cmz_ ni el campo lsm_n).
fisico_2025|esp5_*,bar5_*,fys5_*|2025
acceso_2025|acc5_*,acf5_*|2025
oferta_2025|ofe5_*|2025
territorio_2025|ter_*|2025
poblacion_referencia|pr_*|todas
desventaja_2018|dsv_*|2018
deterioro_censal|manzanas.det_*|-
deterioro_v3|dt3_*|2018
deterioro_v4|dt4_*|2018
educacion_hogar|edh_*|todas
