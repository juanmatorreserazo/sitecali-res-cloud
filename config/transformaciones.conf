# Productos que salen transformados de la zona interna (etapa 35).
#
# Principio: el registro individual nunca sale; el patrón sí. Lo que identifica a una persona es la conjunción de
# lugar, fecha, hora y atributos, no el lugar solo. Por eso los productos suman periodos completos, no llevan
# fecha, hora, edad ni sexo, y todo conteo publicado es 0 o al menos k (regla vigente: 5 víctimas).
#
# Dos reglas distintas que antes estaban mezcladas:
#   · privacidad: k eventos por unidad publicada, con supresión complementaria cuando una resta podría revelar
#     un conteo suprimido (dentro de la comuna, dentro de la celda);
#   · precisión: una tasa con pocos residentes es inestable, pero eso se resuelve con suavizado bayesiano e
#     intervalo, no suprimiendo. El umbral de residentes queda como advertencia, no como censura, porque
#     suprimir las secciones de menos de 1.000 habitantes ocultaría el 7,9 % de los homicidios con el 3,6 % de
#     la población, concentrados en el centro y el pericentro.
#
# Todo se reconstruye desde cero en cada corrida a partir de los puntos originales: cambiar un parámetro y volver
# a correr la ingesta rehace los productos; no se hereda ningún resultado anterior.

[general]
k = 5
# Lados de la rejilla adaptativa, de la más gruesa a la más fina (cada uno la mitad del anterior).
tamanos_m = 3200,1600,800,400,200,100,50
nivel_confianza = 0.90
# Vías que se consideran estructurantes para bordes y corredores (valores de pot_jerarquia_vial.tipo_via)
vias_arteriales = Via Arteria Principal,Via Arteria Secundaria,Via Interegional
vias_colectoras = Via Colectora,Via Colectora Rural
buffer_via_m = 25
permutaciones = 1999
semilla = 20261026

# ---------------------------------------------------------------------------------------- rejillas adaptativas
# Partición en árbol: cada celda se divide en cuatro mientras sus hijas puedan publicarse con al menos k eventos;
# las hijas con menos de k se fusionan entre sí o con la hermana más pequeña. Cada evento queda en una sola hoja,
# las hojas no se traslapan y se publica una sola resolución por producto: no hay restas posibles entre niveles.

[rejilla:homicidio_2018_2024]
capa = homicidios
campo_anio = anio
desde = 2018
hasta = 2024

[rejilla:bomberos_2018_2024]
capa = bomberos_puntos
campo_anio = anio
desde = 2018
hasta = 2024

# ---------------------------------------------------------------------------------------- esquinas
# Los siniestros están geocodificados a la esquina: la esquina es infraestructura, no una persona.
# Las esquinas con al menos k eventos se publican como esquinas; el resto de los eventos va a una rejilla
# adaptativa propia (rejilla_resto). Los dos productos no comparten eventos, así que no hay resta posible entre
# ellos: publicar a la vez una rejilla fina con todos los eventos y las esquinas obligaría a retirar la mitad de
# las esquinas por supresión complementaria (356 de 690 en la prueba del 26-10-2026).
# Subconteos: columna de la capa > 0 → conteo publicado solo si él y su complemento son 0 o ≥ k.

[esquinas:lesionados_esquinas_2021_2025]
capa = vial_lesionados
campo_anio = anio
desde = 2021
hasta = 2025
tolerancia_m = 1
subconteos = moto:n_moto,peat:n_peaton
rejilla_resto = lesionados_resto_2021_2025
nota = n_peaton solo tiene registro desde 2022

# ---------------------------------------------------------------------------------------- tasas suavizadas
# Bayes empírico Poisson-gamma (Marshall, global) con intervalo del posterior. Denominador: años-persona, la suma
# de pr_total de cada año del periodo (m_poblacion_referencia_v25), como manda la regla de población de la v2.5.
# Hasta la base 2.4.19 se usaba la población de 2018 por el número de años. Las secciones son las 945 analíticas y
# «padre» toma la comuna oficial (ter_comuna).

[tasa:homicidio_tasa_barrio_2018_2024]
capa = homicidios
campo_anio = anio
desde = 2018
hasta = 2024
nivel = id_barrio
padre = comuna_n
residentes_advertencia = 1000

[tasa:homicidio_tasa_seccion_2018_2024]
capa = homicidios
campo_anio = anio
desde = 2018
hasta = 2024
nivel = seccion
padre = comuna_n
residentes_advertencia = 1000

# ---------------------------------------------------------------------------------------- conteos por unidad
[conteo:visitas_riesgo_barrio_2025]
capa = visitas_riesgo_sgred_2025
unidades = barrios
llave_unidad = ID_BARRIO
dimension = fenomeno_original

# ---------------------------------------------------------------------------------------- fronteras
# Bordes compartidos entre barrios vecinos: cuánto contrastan los dos lados y qué hay sobre el borde.
# Prueba: ¿los bordes de alto contraste coinciden con vías estructurantes más de lo que daría el azar?
# Variables: campo de manzana (promedio ponderado por residentes) o tasa:<producto> para una tasa publicada.

[fronteras:fronteras_barrio]
unidades = barrios
llave_unidad = ID_BARRIO
llave_manzana = id_barrio
variables = fys5_idx_social,fys5_idx_fisico,dt3_inquilinato_pct,dt3_envejecimiento_pct,dt3_densificacion_pct,dt3_precariedad_pct,edh_anios_prom_25@2018,tasa:homicidio_tasa_barrio_2018_2024
longitud_minima_m = 30
asentamientos = ahdi_poligonos

# ---------------------------------------------------------------------------------------- fronteras de manzana
# La misma pregunta a la resolución de SITECALI: pares de manzanas que se miran a través de una calle. ¿Separa más
# una arteria que una calle local, a igual comuna y distancia? Y, tramo por tramo, ¿qué avenidas funcionan como
# borde? Solo variables públicas de manzana.

[fronteras_manzana:fronteras_manzana]
variables = fys5_idx_social,fys5_idx_fisico,dt3_inquilinato_pct,dt3_envejecimiento_pct,dt3_densificacion_pct,dt3_precariedad_pct,edh_anios_prom_25@2018
distancia_max_m = 60
bandas_m = 15,30,45
pares_minimos_tramo = 20

# ---------------------------------------------------------------------------------------- corredores
# ¿Se concentran los eventos sobre las vías estructurantes más de lo que pesa esa franja en la red vial?
# Razón = (eventos a ≤ buffer de una vía estructurante) / (longitud de red vial urbana a ≤ buffer), en proporción.

[corredores:corredores_estructurantes]
fuentes = homicidio_2018_2024,lesionados_esquinas_2021_2025,bomberos_2018_2024
